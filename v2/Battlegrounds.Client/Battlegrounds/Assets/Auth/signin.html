<style>
  *{box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100%;
    margin:0; padding:40px 24px;
    background:#0d0b09;
    color:#f2ede3;
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  .glow{
    position:fixed; left:50%; top:50%; width:760px; height:760px; transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(224,165,59,.09) 0%,rgba(224,165,59,.025) 36%,transparent 68%);
    pointer-events:none;
  }
  main{position:relative; display:flex; flex-direction:column; align-items:center; gap:34px; max-width:620px}
  .logo{
    height:104px; width:auto; display:block;
    filter:drop-shadow(0 0 34px rgba(224,165,59,.28));
  }
  h1{
    font-family:'Oswald','Arial Narrow',sans-serif;
    font-weight:500; text-transform:uppercase; letter-spacing:.05em;
    font-size:42px; line-height:1.15; margin:0; color:#f2ede3;
  }
  h1 .rule{display:block; width:56px; height:2px; background:#e0a53b; margin:0 auto 22px}
  p{margin:14px 0 0; font-size:17px; line-height:1.7; color:#a39a89; text-wrap:pretty}
  .hint{font-size:14px; color:#6b6455; margin-top:26px}
  .code{font-size:12px; letter-spacing:.06em; color:#5c564a; margin-top:14px}
  .code[hidden]{display:none}
  a{color:#e0a53b; text-decoration:none; border-bottom:1px solid rgba(224,165,59,.35)}
  a:hover{color:#f2ce7e; border-bottom-color:rgba(242,206,126,.6)}
  .fade{opacity:0; animation:fade .6s cubic-bezier(.2,.7,.3,1) forwards}
  .d1{animation-delay:.05s} .d2{animation-delay:.2s} .d3{animation-delay:.34s}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @media (max-width:560px){ .logo{height:64px} h1{font-size:28px} p{font-size:15px} }
  @media (prefers-reduced-motion:reduce){ .fade{animation:none; opacity:1} }
</style>

<script>
(function () {
  var STATES = {
    success: {
      title: 'Signed in',
      heading: 'Signed in',
      body: 'You can close this tab and return to the Battlegrounds launcher.'
    },
    cancelled: {
      title: 'Sign-in cancelled',
      heading: 'Sign-in cancelled',
      body: 'Nothing was changed. You can close this tab and return to the Battlegrounds launcher.'
    },
    error: {
      title: 'Sign-in didn’t complete',
      heading: 'Sign-in didn’t complete',
      body: 'Return to the Battlegrounds launcher to see what happened.'
    }
  };

  function param(name) {
    var pairs = window.location.search.replace(/^\?/, '').split('&');
    for (var i = 0; i < pairs.length; i++) {
      var split = pairs[i].indexOf('=');
      if (split > 0 && pairs[i].slice(0, split) === name) {
        return decodeURIComponent(pairs[i].slice(split + 1).replace(/\+/g, ' '));
      }
    }
    return null;
  }

  var state = STATES[param('status')] || STATES.success;
  document.title = state.title + ' — Company of Heroes: Battlegrounds';
  document.getElementById('heading').textContent = state.heading;
  document.getElementById('body').textContent = state.body;

  // Our own Error.Code, never the provider's -- but rendered as text regardless, because it arrives
  // on a redirect and this page has no business trusting anything that did.
  var code = param('code');
  if (code && state !== STATES.success) {
    var element = document.getElementById('code');
    element.textContent = code;
    element.hidden = false;
  }
})();
</script>
