doctrine:
    id: coh3_afrika_korps_corpo_darmata
    version: 1
    name: Corpo d'Armata
    parent: coh3_afrika_korps_default
    description: "The Corpo d'Armata doctrine represents Italy's contribution to the North African campaign. Italian Bersaglieri, Guastatori assault engineers, and Coastal Reserves provide numerous infantry, while L6/40 light tanks, M13/40 medium tanks, and Semovente self-propelled guns offer a range of Italian armored support. The Cannone da 105 howitzer delivers devastating long-range bombardments. This doctrine emphasizes strength in numbers over individual unit quality."
    short-description: "The Corpo d'Armata doctrine represents Italy's contribution to the North African campaign."
    type-limits:
        apex_armor: 1
        elite_infantry: 4
    phase-limits: # These values should add up to 34
        initial: 7
        skirmish: 9
        battle: 10
        reserves: 8
    blueprints:
        squads:
            - bersaglieri_ak
            - coastal_reserve_ak
            - guastatori_ak
            - l6_40_ak
            - m13_40_ak
            - semovente_75_18_ak
            - howitzer_cannone_da_105_ak
        upgrades: []
    crew-blueprint: bersaglieri_ak
