    parent: coh3_afrika_korps_default
    description: "The Aufklärung doctrine focuses on mobile reconnaissance and raiding across the vast North African desert. Fast-moving Bersaglieri infantry provide forward scouting alongside nimble L6/40 light tanks, while the armored SdKfz 254 tractor serves as forward observation. Goliath remote-controlled demolition vehicles set devastating ambushes against unwary enemy columns. This doctrine rewards aggressive reconnaissance and hit-and-run tactics."
