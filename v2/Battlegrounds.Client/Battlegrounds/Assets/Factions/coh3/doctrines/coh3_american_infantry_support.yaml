doctrine:
    id: coh3_american_infantry_support
    version: 1
    faction: american
    name: Infantry Support Company
    parent: coh3_american_default
    description: "The Infantry Support Company doctrine provides a broad-based combined arms approach to the Italian campaign. Assault Engineers handle obstacles and fortifications at the front, while Pack Howitzers and heavy .50 Caliber Machine Guns bolster the infantry line with versatile fire support. Light trucks provide flexible logistics and towing capability across the difficult Italian terrain. This doctrine offers a well-rounded force suited to any battlefield situation."
    type-limits:
        apex_armor: 2
    phase-limits: # These values should add up to 36
        initial: 6
        skirmish: 10
        battle: 11
        reserves: 9
    blueprints:
        squads:
            - assault_engineer_us
            - pack_howitzer_75mm_us
            - hmg_50cal_us
            - truck_4x4_us
            - truck_6x6_us
        upgrades: []
