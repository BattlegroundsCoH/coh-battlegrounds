# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test .NET Desktop Application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:

    runs-on: windows-latest
    
    permissions:
      packages: read
      contents: read

    steps:
    - uses: actions/checkout@v6
      
    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # dotnet build does not catch a missing x:Key: a StaticResource throws only when the view is
    # first opened, and a DynamicResource silently resolves to nothing.
    - name: Check XAML resource keys
      run: cd v2\Battlegrounds.Client && python scripts\check-xaml-resources.py

    - name: Restore dependencies
      run: cd v2\Battlegrounds.Client && dotnet restore

    - name: Build and Test
      run: cd v2\Battlegrounds.Client && dotnet test --verbosity=n --filter=TestCategory!=Integration
